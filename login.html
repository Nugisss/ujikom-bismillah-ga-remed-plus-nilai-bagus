<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk | Monitoring IoT</title>
<link rel="stylesheet" href="css/style.css?v=1" />
<style>
  .input-wrapper {
    position: relative !important;
    display: flex !important;
    align-items: center !important;
    width: 100% !important;
  }
  .input-wrapper input {
    width: 100% !important;
    padding-right: 42px !important;
    box-sizing: border-box !important;
    flex: 1 !important;
    min-width: 0 !important;
  }
  .toggle-pass-btn {
    position: absolute !important;
    right: 10px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    background: none !important;
    border: none !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 4px !important;
    width: auto !important;
    height: auto !important;
    flex-shrink: 0 !important;
    color: inherit !important;
    line-height: 1 !important;
  }
  .close-btn {
    position: absolute !important;
    top: 14px !important;
    right: 14px !important;
    width: 34px !important;
    height: 34px !important;
    border: none !important;
    border-radius: 50% !important;
    background: rgba(255,255,255,0.85) !important;
    color: #333 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 18px !important;
    line-height: 1 !important;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12) !important;
  }
  .close-btn:hover {
    background: rgba(255,255,255,1) !important;
  }
</style>
</head>
<body class="login-body">
<div class="login-wrapper">
  <div class="login-card">
    <button type="button" class="close-btn" onclick="window.location.href='index.html'" aria-label="Kembali ke beranda">×</button>
    <div class="login-brand">
      <img src="img/logo.png" alt="Logo" />
      <h1>Selamat Datang Kembali</h1>
      <p>Masuk untuk mengakses dashboard monitoring Anda</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required />
      </div>
      <div class="form-group password-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" class="toggle-pass-btn" id="toggleBtn" onclick="togglePassword()" aria-label="Tampilkan password">
            <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-row">
        <label class="checkbox">
          <input type="checkbox" /> Ingat saya
        </label>
        <a href="#" class="link">Lupa password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      <p id="loginMessage" class="form-message"></p>
      <p class="form-footer">Belum punya akun? <a href="#" class="link">Daftar di sini</a></p>
    </form>
  </div>
  <div class="login-art">
    <div class="art-content">
      <h2>Monitoring <br/>Lebih Cerdas</h2>
      <p>Pantau seluruh sensor IoT Anda dalam satu dashboard yang elegan dan modern.</p>
    </div>
  </div>
</div>
<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const btn = document.getElementById('toggleBtn');
    const eye = document.getElementById('iconEye');
    const eyeOff = document.getElementById('iconEyeOff');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    eye.style.display = isHidden ? 'none' : '';
    eyeOff.style.display = isHidden ? '' : 'none';
    btn.setAttribute('aria-label', isHidden ? 'Sembunyikan password' : 'Tampilkan password');
  }
</script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
