<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk | Monitoring IoT</title>
    <link rel="stylesheet" href="css/style.css?v=1" />
    <style>
      .input-wrapper {
        position: relative;
        width: 100%;
        display: block;
      }

      .input-wrapper input {
        width: 100%;
        padding: 12px 14px;
        padding-right: 44px;
        box-sizing: border-box;
        height: 44px;
        line-height: 1.5;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 14px;
        transition:
          border 0.15s ease,
          box-shadow 0.15s ease;
        outline: none;
        background: #fafbfd;
        font-family: "Poppins", sans-serif;
      }

      .input-wrapper input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        background: #fff;
      }

      .toggle-pass-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        color: #6b7280;
        line-height: 1;
        z-index: 10;
        transition: color 0.2s ease;
      }

      .toggle-pass-btn:hover {
        color: #1f2937;
      }

      .toggle-pass-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      .close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        color: #333;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        transition: background 0.2s ease;
        z-index: 100;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 1);
      }
    </style>
  </head>
  <body class="login-body">
    <div class="login-wrapper">
      <div class="login-card">
        <button type="button" class="close-btn" onclick="window.location.href = 'index.html'" aria-label="Kembali ke beranda">×</button>
        <div class="login-brand">
          <img src="img/logo.png" alt="Logo" />
          <h1>Selamat Datang Kembali</h1>
          <p>Masuk untuk mengakses dashboard monitoring Anda</p>
        </div>
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@email.com" required />
          </div>
          <div class="form-group password-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="••••••••" required />
              <button type="button" class="toggle-pass-btn" id="toggleBtn" onclick="togglePassword()" aria-label="Tampilkan password">
                <svg id="iconEye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>
          <div class="form-row">
            <label class="checkbox"> <input type="checkbox" /> Ingat saya </label>
            <a href="#" class="link">Lupa password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Masuk</button>
          <p id="loginMessage" class="form-message"></p>
          <p class="form-footer">Belum punya akun? <a href="#" class="link">Daftar di sini</a></p>
        </form>
      </div>
      <div class="login-art">
        <div class="art-content">
          <h2>Monitoring <br />Lebih Cerdas</h2>
          <p>Pantau seluruh sensor IoT Anda dalam satu dashboard yang elegan dan modern.</p>
        </div>
      </div>
    </div>
    <script>
      function togglePassword() {
        const input = document.getElementById("password");
        const btn = document.getElementById("toggleBtn");
        const eye = document.getElementById("iconEye");
        const eyeOff = document.getElementById("iconEyeOff");
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        eye.style.display = isHidden ? "none" : "";
        eyeOff.style.display = isHidden ? "" : "none";
        btn.setAttribute("aria-label", isHidden ? "Sembunyikan password" : "Tampilkan password");
      }
    </script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
